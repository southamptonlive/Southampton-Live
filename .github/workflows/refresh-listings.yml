name: Refresh Soton Live listings

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild events.json from live sources
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: node build-events.mjs

      - name: Classify unknown artists (Claude — optional)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node classify-events.mjs

      - name: Commit refreshed listings (if changed)
        run: |
          git config user.name  'sotonlive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add events.json genre-overrides.json index.html
          git diff --cached --quiet || git commit -m "listings: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Assemble deployable site
        run: |
          mkdir -p dist
          cp index.html events.json logo.png dist/
          for f in privacy.html about.html; do [ -f "$f" ] && cp "$f" dist/; done
          ls -la dist/

      - name: Deploy to SiteGround (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 120000
          local-dir: ./dist/
          server-dir: ./
