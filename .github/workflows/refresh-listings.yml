# Southampton.Live — scheduled listings refresh + deploy to SiteGround
#
# Place at .github/workflows/refresh-listings.yml in a repo containing
# index.html, events.json, build-events.mjs, classify-events.mjs,
# genre-overrides.json and logo.png at its root.
#
# Every 3 hours it: re-scrapes every source → runs the AI genre classifier
# (if ANTHROPIC_API_KEY is set) → commits the refreshed data → deploys the
# site to SiteGround over FTPS. The app also refetches events.json every
# 15 minutes while open, so visitors get new data without reloading.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. yourdomain.co.uk  (or the SiteGround server hostname)
#   FTP_USERNAME  the FTP account you create in Site Tools → Site → FTP Accounts
#   FTP_PASSWORD  its password
# Optional secrets:
#   TM_API_KEY         free at developer.ticketmaster.com — adds TM listings
#   ANTHROPIC_API_KEY  enables the AI genre-classification pass (34-genre vocabulary; never guesses)
#   SKIDDLE_API_KEY    official Skiddle API — licensed images/genres/affiliate
#   GA4_MEASUREMENT_ID G-XXXXXXXXXX — injected into the deployed index.html only; absent = analytics off

name: Refresh Southampton.Live listings

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours (offset to dodge the top-of-hour stampede)
  workflow_dispatch: {}       # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild events.json from live sources
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
          SKIDDLE_API_KEY: ${{ secrets.SKIDDLE_API_KEY }}
        run: node build-events.mjs

      - name: Classify unknown artists (Claude — optional)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node classify-events.mjs

      - name: Check the feed before it ships (no-fiction + source link checks)
        run: node check-feed.mjs

      - name: Render static pages, sitemap and calendar feeds
        run: node render-pages.mjs

      - name: Commit refreshed listings (if changed)
        run: |
          git config user.name  'southamptonlive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A events.json genre-overrides.json index.html pages cal pages-state.json
          git diff --cached --quiet || git commit -m "listings: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          # push is bookkeeping; deploy below works from this checkout either way.
          # on a race, rebase and let our freshly generated artifacts win (-X theirs
          # during rebase = the commit being replayed, i.e. this run's build);
          # if anything still fails, skip the push — the next run carries it.
          git push || {
            git fetch origin main &&
            { git rebase -X theirs origin/main || { git rebase --abort 2>/dev/null || true; false; }; } &&
            git push || echo "push skipped this run — will be carried by the next refresh";
          }

      - name: Assemble deployable site
        run: |
          mkdir -p dist
          cp index.html events.json logo.png dist/
          # ship any extra static pages if present (privacy, about…)
          for f in privacy.html terms.html about.html share-card.png icon-512.png .htaccess robots.txt; do [ -f "$f" ] && cp "$f" dist/; done
          # static sub-pages (e.g. about/free/index.html)
          [ -d about ] && mkdir -p dist/about && cp -r about/. dist/about/
          # venue photos + their manifest (venue cards and venue pages read these)
          [ -f venue-photos.json ] && cp venue-photos.json dist/
          [ -d venues ] && mkdir -p dist/venues && cp -r venues/. dist/venues/
          # pre-rendered pages (e/, v/, d/, tonight, this-weekend, sitemap) and calendar feeds
          [ -d pages ] && cp -r pages/. dist/
          [ -d cal ] && mkdir -p dist/cal && cp -r cal/. dist/cal/
          # GA4 measurement ID is injected here, into the deploy copy only — the
          # committed index.html keeps the placeholder (DR-003). No secret = analytics off.
          if [ -n "${{ secrets.GA4_MEASUREMENT_ID }}" ]; then
            sed -i "s/__GA4_MEASUREMENT_ID__/${{ secrets.GA4_MEASUREMENT_ID }}/" dist/index.html
            echo "analytics: GA4 id injected"
          else
            echo "analytics: GA4_MEASUREMENT_ID secret not set — analytics off, no banner"
          fi
          ls -la dist/

      - name: Deploy to SiteGround (FTPS)
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: ./dist/
          server-dir: ./

      - name: Deploy retry (only if first attempt failed)
        id: deploy2
        continue-on-error: true
        if: steps.deploy1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: ./dist/
          server-dir: ./

      - name: Deploy final attempt (after a cool-off)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - name: Deploy third attempt
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: ./dist/
          server-dir: ./
