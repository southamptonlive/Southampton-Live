# Soton Live — scheduled listings refresh + deploy to SiteGround
#
# Place at .github/workflows/refresh-listings.yml in a repo containing
# index.html, events.json, build-events.mjs, classify-events.mjs,
# genre-overrides.json and logo.png at its root.
#
# Every 3 hours it: re-scrapes every source → runs the AI genre classifier
# (if ANTHROPIC_API_KEY is set) → commits the refreshed data → deploys the
# site to SiteGround over FTPS. The app also refetches events.json every
# 15 minutes while open, so visitors get new data without reloading.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. yourdomain.co.uk  (or the SiteGround server hostname)
#   FTP_USERNAME  the FTP account you create in Site Tools → Site → FTP Accounts
#   FTP_PASSWORD  its password
# Optional secrets:
#   TM_API_KEY         free at developer.ticketmaster.com — adds TM listings
#   ANTHROPIC_API_KEY  enables the AI genre-classification pass

name: Refresh Soton Live listings

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours (offset to dodge the top-of-hour stampede)
  workflow_dispatch: {}       # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild events.json from live sources
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: node build-events.mjs

      - name: Classify unknown artists (Claude — optional)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node classify-events.mjs

      - name: Commit refreshed listings (if changed)
        run: |
          git config user.name  'sotonlive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add events.json genre-overrides.json index.html
          git diff --cached --quiet || git commit -m "listings: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Assemble deployable site
        run: |
          mkdir -p dist
          cp index.html events.json logo.png dist/
          # ship any extra static pages if present (privacy, about…)
          for f in privacy.html terms.html about.html; do [ -f "$f" ] && cp "$f" dist/; done
          ls -la dist/

      - name: Deploy to SiteGround (FTPS)
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 60000
          local-dir: ./dist/
          server-dir: ./

      - name: Deploy retry (only if first attempt failed)
        if: steps.deploy1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 60000
          local-dir: ./dist/
          server-dir: ./
