<style>
  :root {
    --violet:#FF0000; --mint:#2EE6A8; --amber:#FF7A00; --rose:#FF3B30; --cyan:#4DA8FF; --blue:#4DA8FF;
    --ink:#000000; --panel:#101010; --line:#242424;
    --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
  }
  * { -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior:smooth; }
  body {
    background:
      radial-gradient(900px 420px at 85% -10%, rgba(255,0,0,.13), transparent 60%),
      radial-gradient(700px 380px at -10% 8%, rgba(255,122,0,.06), transparent 55%),
      var(--ink);
    color:#EDEDF4;
    font-family:"Space Grotesk",system-ui,sans-serif;
    overscroll-behavior-y:contain;
  }
  ::selection { background:var(--violet); color:#ffffff; }
  .no-scrollbar { scrollbar-width:none; -ms-overflow-style:none; }
  .no-scrollbar::-webkit-scrollbar { display:none; }
  .snapx { scroll-snap-type:x mandatory; }
  .snapc { scroll-snap-align:start; }

  /* ---------- LIVE dot ---------- */
  .livedot { position:relative; width:10px; height:10px; border-radius:999px; background:var(--mint); }
  .livedot::after { content:""; position:absolute; inset:-4px; border-radius:999px; border:2px solid var(--mint); opacity:.8; animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite; }
  .livedot.demo { background:#FF7A00; }
  .livedot.demo::after { border-color:#FF7A00; }
  @keyframes ping { 0%{transform:scale(.6);opacity:.9} 80%,100%{transform:scale(1.9);opacity:0} }

  /* ---------- Filter chips ---------- */
  .chip {
    min-height:44px; padding:0 16px; border-radius:999px;
    border:1.5px solid #2c2c2c; background:#101010;
    color:#d8d8d8; font-weight:600; font-size:14px; letter-spacing:.01em;
    display:inline-flex; align-items:center; gap:8px; white-space:nowrap;
    transition:transform .12s ease, background .15s ease, border-color .15s ease, color .15s ease;
    cursor:pointer; user-select:none;
  }
  .chip:active { transform:scale(.95); }
  .chip .dot { width:8px; height:8px; border-radius:99px; background:var(--c,#fff); }
  .chip.on { background:#fff; border-color:#fff; color:#000; font-weight:700; }
  .chip.on .dot { background:#000; }
  .railtag { font-size:11.5px; font-weight:700; letter-spacing:.14em; color:#8A8AA3; text-transform:uppercase; }

  /* ---------- Buttons ---------- */
  .btn { min-height:48px; border-radius:16px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .12s ease, filter .15s ease, background .15s ease, box-shadow .15s ease; cursor:pointer; user-select:none; }
  .btn:active { transform:scale(.96); }
  .btn-violet { background:linear-gradient(135deg,#FF0000,#C50000); color:#fff; box-shadow:0 8px 24px -8px rgba(255,0,0,.55); }
  .btn-violet:hover { filter:brightness(1.08); }
  .btn-ghost { background:rgba(23,23,36,.8); border:2px solid var(--line); color:#E6E6F0; }
  .btn-ghost:hover { border-color:#3a3a55; }
  .btn-mint { background:var(--mint); color:#062b1d; box-shadow:0 8px 24px -10px rgba(52,211,153,.7); }
  .btn-amber { background:var(--amber); color:#2a1802; box-shadow:0 8px 24px -10px rgba(255,178,36,.7); }
  .btn.going-on { background:linear-gradient(135deg,#FF7A00,#FF3B30); color:#fff; box-shadow:0 0 20px -4px rgba(255,122,0,.7); }
  .iconbtn { width:48px; height:48px; border-radius:16px; display:inline-flex; align-items:center; justify-content:center; transition:transform .12s ease, background .15s ease, color .15s, border-color .15s; cursor:pointer; }
  .iconbtn:active { transform:scale(.9); }

  /* ---------- Poster ---------- */
  .poster { position:relative; overflow:hidden; isolation:isolate; background:#1b1b28; }
  .poster::after { content:""; position:absolute; inset:0; background-image:var(--grain); opacity:.22; mix-blend-mode:overlay; pointer-events:none; z-index:3; }
  .poster .shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(6,6,12,.28) 0%, rgba(6,6,12,0) 34%, rgba(6,6,12,.06) 58%, rgba(6,6,12,.78) 100%); z-index:2; }
  .poster img.userimg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
  .poster-type {
    position:absolute; left:12px; right:12px; bottom:12px; z-index:2;
    font-family:"Archivo Black",sans-serif; text-transform:uppercase; color:#fff;
    line-height:.92; letter-spacing:.005em; word-break:break-word;
    text-shadow:0 3px 22px rgba(0,0,0,.55), 0 1px 0 rgba(0,0,0,.35);
  }
  .poster-type .sub { font-family:"Space Grotesk",sans-serif; font-weight:700; text-transform:none; letter-spacing:.02em; opacity:.92; text-shadow:0 2px 12px rgba(0,0,0,.6); }
  .badge {
    display:inline-flex; align-items:center; gap:5px;
    font-size:12px; font-weight:700; letter-spacing:.03em;
    padding:5px 10px; border-radius:10px; backdrop-filter:blur(6px);
    background:rgba(9,9,15,.68); border:1.5px solid rgba(255,255,255,.16); color:#fff;
  }
  .badge.solid-amber { background:var(--amber); color:#241300; border-color:transparent; }
  .badge.solid-mint { background:var(--mint); color:#04291b; border-color:transparent; }
  .badge.solid-rose { background:var(--rose); color:#fff; border-color:transparent; }
  .badge.solid-violet { background:var(--violet); color:#0b0518; border-color:transparent; }
  .sticker { transform:rotate(-3deg); box-shadow:0 4px 14px rgba(0,0,0,.4); }
  .gtag { font-size:12px; font-weight:700; padding:5px 11px; border-radius:999px; border:1.5px solid var(--c); color:var(--c); display:inline-flex; align-items:center; gap:6px; background:color-mix(in srgb, var(--c) 12%, transparent); }
  .gtag .gd { width:7px; height:7px; border-radius:99px; background:var(--c); }

  .card { border-radius:22px; overflow:hidden; background:var(--panel); border:1.5px solid var(--line); transition:transform .15s ease, border-color .2s ease, box-shadow .2s ease; }
  .card:active { transform:scale(.985); }
  .hero-card { box-shadow:0 24px 50px -22px rgba(0,0,0,.85); }

  /* ---------- Ticket stub ---------- */
  .ticket { position:relative; border-radius:20px; overflow:hidden; background:linear-gradient(120deg,#171724,#12121c); border:1.5px solid var(--line); }
  .ticket .rip { position:relative; width:0; border-left:2.5px dashed #3d3d58; margin:14px 0; }
  .ticket .rip::before, .ticket .rip::after { content:""; position:absolute; left:-11px; width:20px; height:20px; border-radius:99px; background:var(--ink); border:1.5px solid var(--line); }
  .ticket .rip::before { top:-24px; }
  .ticket .rip::after { bottom:-24px; }
  .barcode { width:54px; align-self:stretch; border-radius:6px; background:repeating-linear-gradient(90deg,#EDEDF4 0 2px, transparent 2px 5px, #EDEDF4 5px 6px, transparent 6px 10px, #EDEDF4 10px 13px, transparent 13px 16px); opacity:.85; }

  /* ---------- EQ / audio placeholder ---------- */
  .eq { display:flex; align-items:flex-end; gap:3px; height:22px; }
  .eq i { width:4px; border-radius:2px; background:var(--mint); height:30%; }
  .playing .eq i { animation:eq 0.9s ease-in-out infinite; }
  .playing .eq i:nth-child(2){ animation-delay:.12s } .playing .eq i:nth-child(3){ animation-delay:.24s }
  .playing .eq i:nth-child(4){ animation-delay:.06s } .playing .eq i:nth-child(5){ animation-delay:.3s }
  @keyframes eq { 0%,100%{height:22%} 40%{height:100%} 70%{height:45%} }

  /* ---------- Forms ---------- */
  .field { width:100%; min-height:52px; border-radius:14px; background:#171724; border:2px solid var(--line); color:#EDEDF4; padding:12px 16px; font-size:16px; font-weight:500; outline:none; transition:border-color .15s ease, box-shadow .15s ease; }
  .field::placeholder { color:#6D6D88; }
  .field:focus { border-color:var(--violet); box-shadow:0 0 0 4px rgba(255,0,0,.18); }
  .field.err { border-color:var(--rose); box-shadow:0 0 0 4px rgba(244,63,94,.18); animation:shake .35s ease; }
  .flabel { font-size:13px; font-weight:700; color:#A9A9C2; margin-bottom:7px; display:block; }
  .ferr { display:none; margin-top:7px; font-size:13.5px; font-weight:700; color:var(--rose); }
  .ferr.show { display:flex; align-items:center; gap:6px; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  select.field { appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23A9A9C2' stroke-width='2.5'><path d='m6 9 6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 16px center; padding-right:44px; }
  input[type="date"].field, input[type="time"].field { color-scheme:dark; }

  /* ---------- Modal ---------- */
  .overlay { position:fixed; inset:0; z-index:70; background:rgba(5,5,10,.72); backdrop-filter:blur(8px); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .overlay.open { opacity:1; pointer-events:auto; }
  .sheet { width:100%; max-width:560px; max-height:92dvh; overflow-y:auto; background:var(--ink); border:1.5px solid var(--line); border-bottom:none; border-radius:26px 26px 0 0; transform:translateY(30px); transition:transform .25s cubic-bezier(.2,.9,.3,1.1); }
  .overlay.open .sheet { transform:translateY(0); }
  @media (min-width:640px){ .overlay{align-items:center;padding:24px} .sheet{border-radius:26px;border-bottom:1.5px solid var(--line)} }

  /* ---------- Toast ---------- */
  .toast { background:#171724; border:1.5px solid var(--line); border-left:4px solid var(--mint); color:#EDEDF4; border-radius:14px; padding:13px 16px; font-weight:600; font-size:14.5px; box-shadow:0 14px 30px -12px rgba(0,0,0,.8); animation:toastin .25s cubic-bezier(.2,.9,.3,1.15); display:flex; align-items:center; gap:9px; }
  .toast.amber { border-left-color:var(--amber); }
  .toast.violet { border-left-color:var(--violet); }

  /* ---------- Nav ---------- */
  .navbtn { flex:1; min-height:58px; border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:#7C7C99; font-size:11.5px; font-weight:700; letter-spacing:.04em; transition:color .15s ease, background .15s ease; position:relative; cursor:pointer; }
  .navbtn.on { color:#fff; background:rgba(255,0,0,.18); }
  .navbtn.on::after { content:""; position:absolute; top:6px; right:calc(50% - 22px); width:0; }
  .navbtn .bub { position:absolute; top:6px; right:calc(50% - 26px); min-width:19px; height:19px; padding:0 5px; border-radius:99px; background:var(--rose); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .safe-b { padding-bottom:max(10px, env(safe-area-inset-bottom)); }

  .up { transition:transform .12s ease, color .15s, border-color .15s, background .15s; }

  .pop { animation:pop .3s cubic-bezier(.2,1.4,.4,1); }

  .divline { height:1.5px; background:linear-gradient(90deg, var(--line), transparent); }

  /* ---------- v2 restyle: condensed heds, artwork-first cards, white panels ---------- */

  .wpanel { background:#fff; color:#0A0A0A; }

  .save-off-l { border:2px solid #E7E7E7; color:#7a7a7a; background:#fff; border-radius:14px; }
  .save-on-l { border:2px solid #0A0A0A; background:#0A0A0A; color:#fff; border-radius:14px; }
  .pricepill { background:#0A0A0A; color:#fff; font-weight:800; font-size:12px; padding:5px 11px; border-radius:999px; white-space:nowrap; }

  /* ---------- v3: list-first guide (the Headfirst pattern) ---------- */
  .ttab { color:#8a8a8a; font-weight:700; font-size:14px; padding:9px 1px; border-bottom:2px solid transparent; white-space:nowrap; transition:color .15s ease, border-color .15s ease; }
  .ttab.on { color:#fff; border-color:var(--violet); }
  .dayhead {
    position:sticky; top:var(--stickyh, 110px); z-index:35;

    background:rgba(0,0,0,.92); backdrop-filter:blur(10px);
    margin:0 -16px; padding:10px 16px 8px;
  }
  .row { display:flex; gap:13px; padding:13px 0; border-bottom:1px solid #1b1b1b; cursor:pointer; }
  .row:active { background:#0d0d0d; }
  .thumb { position:relative; width:92px; height:92px; border-radius:10px; overflow:hidden; flex-shrink:0; }
  .thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .thumb .thumb-fb { display:none; }
  .thumb.noart .thumb-fb {
    display:block; position:absolute; left:6px; right:6px; bottom:6px;
    font-family:"Archivo Black",sans-serif; font-size:9.5px; line-height:1.05; text-transform:uppercase;
    color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.6); word-break:break-word;
  }
  .ribbon { display:block; width:92px; margin-top:4px; text-align:center; font-size:9.5px; font-weight:800; letter-spacing:.06em; padding:3px 0; border-radius:6px; background:var(--violet); color:#fff; }

  .calg { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cald { position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; border-radius:10px; color:#3a3a3a; }
  .cald.none { color:#565656; }

  .cald.has:active { transform:scale(.9); }
  .cald.has i { position:absolute; top:3px; right:4px; font-style:normal; font-size:9px; font-weight:800; color:var(--violet); }
  .cald.today { border-color:var(--violet); }

  /* ---------- v4: desktop layout, lifted surfaces, clear affordance ---------- */
  /* ---------- v5: hero + gimmick pills (AtomGlide language) ---------- */
  .ad-outer { position:relative; width:100%; padding:10px 16px 4px; display:flex; justify-content:center; }
  .ad-tag { position:absolute; top:12px; left:18px; z-index:2; font-size:9px; font-weight:800; letter-spacing:.1em; color:#8a8a8a; border:1px solid #333; border-radius:5px; padding:2px 5px; background:rgba(0,0,0,.6); }

  .hero-stick { position:absolute; top:16px; left:16px; transform:rotate(-4deg); background:#fff; color:#000; font-weight:800; font-size:12.5px; letter-spacing:.06em; padding:9px 16px; border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.45); }
  .hero-type { position:absolute; left:18px; right:18px; bottom:16px; color:#fff; }
  .hero-title { font-size:clamp(30px, 7.5vw, 54px); line-height:.92; text-shadow:0 4px 26px rgba(0,0,0,.65); word-break:break-word; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; }
  .hero-info { display:flex; flex-direction:column; background:linear-gradient(160deg, var(--violet), #A50000); color:#fff; padding:20px; }
  .hero-tag { font-size:12px; font-weight:700; border:1.5px solid rgba(255,255,255,.55); border-radius:999px; padding:5px 12px; }
  .hero-tag.solid { background:#000; border-color:#000; }
  .gpill { background:#000; color:#fff; border-radius:999px; }

  .cbtn { width:56px; height:56px; border-radius:999px; border:2.5px solid rgba(255,255,255,.85); color:#fff; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .12s ease, background .15s ease, color .15s ease; }
  .cbtn:active { transform:scale(.9); }
  .cbtn.on, .cbtn:hover { background:#fff; color:var(--violet); }
  .tpill { min-height:50px; padding:0 20px; border-radius:999px; border:2.5px solid var(--c,#fff); color:var(--c,#fff); font-weight:800; font-size:15px; white-space:nowrap; display:inline-flex; align-items:center; transition:background .15s ease, color .15s ease, transform .12s ease; }
  .tpill:active { transform:scale(.95); }
  .tpill.on { background:var(--c,#fff); color:#000; }
  .chip { min-height:50px; padding:0 18px; border-width:2px; font-size:15px; font-weight:700; border-radius:999px; }

  .genpost { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:7px; overflow:hidden; }

  .site-foot { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px;

}
function plusDays(n){ const d = new Date(); d.setDate(d.getDate() + n); return localISO(d); }

  const dow = new Date().getDay();          // 0 Sun … 6 Sat
  if (dow === 5) return [0, 1, 2];

function loadState(){
  try {
    const raw = store.getItem(LS_KEY);
    if (raw){
      const d = JSON.parse(raw);
      state.rsvps      = d.rsvps      || {};
      state.saved      = d.saved      || {};
      state.upvoted    = d.upvoted    || {};
      state.userEvents = d.userEvents || [];
      state.follows    = d.follows    || { venues:{}, artists:{} };
      state.notified   = d.notified   || {};
      state.notifyOn   = !!d.notifyOn;
      state.homeDistrict = d.homeDistrict || "";
      state.threads    = d.threads    || null;
      state.handle     = d.handle     || "";
    }
  } catch(e){}
  if (!state.threads) state.threads = SEED_THREADS.map(t => ({ ...t, comments:[...t.comments] }));
}
function save(){
  try {
    store.setItem(LS_KEY, JSON.stringify({
      rsvps: state.rsvps, saved: state.saved, upvoted: state.upvoted,
      userEvents: state.userEvents, threads: state.threads, handle: state.handle,
      follows: state.follows, notified: state.notified, notifyOn: state.notifyOn, homeDistrict: state.homeDistrict
    }));
  } catch(e){}
}

/* ---------- event helpers ---------- */
const allEvents = () => {
  const ids = new Set();
  const out = [];
  for (const e of [...state.userEvents, ...(typeof communityEvents !== "undefined" ? communityEvents : []), ...LIVE.events]){
    if (ids.has(e.id)) continue;
    ids.add(e.id); out.push(e);
  }
  return out;
};
const upcoming  = () => allEvents().filter(ev => ev.date >= TODAY);
const getEvent  = id => allEvents().find(e => e.id === id);
const evVenueName = ev => venueOf(ev) ? venueOf(ev).name : (ev.venueName || "TBA");
const evPostcode  = ev => venueOf(ev) ? venueOf(ev).postcode : (ev.postcode || "SO14");
const hypeCount   = ev => (ev.hype || 0) + (state.rsvps[ev.id] ? 1 : 0);

function matchesFilters(ev){
  const f = state.filters;
  if (f.date === "today"    && ev.date !== TODAY) return false;
  if (f.date === "tomorrow" && ev.date !== plusDays(1)) return false;
  if (f.date === "weekend"  && !WKND.includes(ev.date)) return false;
  if (f.date === "custom"   && f.customDate && ev.date !== f.customDate) return false;
  if (f.region !== "all"){
    const d = district(evPostcode(ev));
    if (f.region === "SO16+"){ if (!(d >= 16 && d !== 17)) return false; }
    else if (!String(evPostcode(ev)).toUpperCase().startsWith(f.region)) return false;
  }
  if (f.type !== "all" && (ev.type || "gig") !== f.type) return false;
  if (f.venue !== "all" && ev.venueId !== f.venue) return false;
  if (f.genres.length && !f.genres.includes(ev.genre)) return false;
  if (state.search){
    const q = state.search.toLowerCase();
    const hay = [ev.artist, evVenueName(ev), evPostcode(ev), (GENRES[ev.genre]||{}).label, ...(ev.lineup||[])].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
const filteredEvents = () => upcoming().filter(matchesFilters);
const activeFilterCount = () => {
  const f = state.filters;
  return (f.date !== "all") + (f.region !== "all") + (f.venue !== "all") + f.genres.length + (state.search ? 1 : 0);
};

/* ---------- render: filter bar ---------- */
function chip(label, on, onclick, extra = ""){
  return `<button class="chip snapc ${on ? "on" : ""}" ${extra} onclick="${onclick}">${label}</button>`;
}
function filterGroups(){
  const f = state.filters;
  const oc = `style="--c:#FF7A00"`, mc = `style="--c:#2EE6A8"`;
  const dateRow = [
    chip("All dates", f.date === "all", "setDateF('all')", oc),
    chip("Today", f.date === "today", "setDateF('today')", oc),
    chip("Tomorrow", f.date === "tomorrow", "setDateF('tomorrow')", oc),
    chip("This weekend", f.date === "weekend", "setDateF('weekend')", oc),
    chip("Pick a date", f.date === "custom", "setDateF('custom')", oc),
    f.date === "custom" ? `<input type="date" class="field !min-h-[44px] !py-0 w-[158px]" min="${TODAY}" value="${esc(f.customDate)}" onchange="setCustomDate(this.value)">` : ""
  ].join("");
  const regions = [["all","All SO"],["SO14","SO14 · City"],["SO15","SO15 · Polygon"],["SO17","SO17 · Portswood"],["SO16+","SO16+ · Wider"]];
  const regionRow = regions.map(([v, l]) => chip(l, f.region === v, `setRegion('${v}')`, mc)).join("");
  const venueRow = [chip("All venues", f.venue === "all", "setVenueF('all')")]
    .concat(RUNTIME_VENUES.map(v => {
      const cnt = upcoming().filter(e => e.venueId === v.id).length;
      if (!cnt && f.venue !== v.id) return "";
      return chip(`${esc(v.name)} <span class="text-[11px] opacity-60 font-bold">${cnt}</span>`, f.venue === v.id, `setVenueF('${v.id}')`);
    })).join("");
  const genreRow = Object.entries(GENRES).map(([k, g]) =>
    chip(`<span class="dot"></span>${g.label}`, f.genres.includes(k), `toggleGenre('${k}')`, `style="--c:${g.color}"`)).join("");
  return { dateRow, regionRow, venueRow, genreRow };
}

/* ---------- render: calendar ---------- */
function gotoDay(iso){
  state.filters.date = "custom";
  state.filters.customDate = iso;
  setHash("#/day/" + iso);
  setTab("gigs");
}
function renderCalendar(){
  const counts = {};
  upcoming().forEach(e => { counts[e.date] = (counts[e.date] || 0) + 1; });
  const maxDate = Object.keys(counts).sort().pop() || TODAY;
  const now = new Date();
  let y = now.getFullYear(), m = now.getMonth();
  const months = [];
  for (let i = 0; i < 14; i++){
    const first = new Date(y, m + i, 1);
    const iso1 = localISO(first).slice(0, 7);
    if (iso1 > maxDate.slice(0, 7)) break;
    months.push(first);
  }
  const dows = ["M","T","W","T","F","S","S"];
  const monthsHtml = months.map(first => {
    const yy = first.getFullYear(), mm = first.getMonth();
    const daysIn = new Date(yy, mm + 1, 0).getDate();
    const lead = (first.getDay() + 6) % 7; // Monday-start
    let cells = "";
    for (let i = 0; i < lead; i++) cells += `<span></span>`;
    for (let d = 1; d <= daysIn; d++){
      const iso = `${yy}-${String(mm + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const n = counts[iso] || 0;
      const past = iso < TODAY;
      const today = iso === TODAY;
      if (past || !n) cells += `<span class="cald ${past ? "past" : "none"}">${d}</span>`;
      else cells += `<button class="cald has ${today ? "today" : ""}" onclick="gotoDay('${iso}')">${d}<i>${n}</i></button>`;
    }
    return `
    <div class="mb-5">
      <h3 class="font-hed text-[19px] mb-2.5">${first.toLocaleDateString("en-GB", { month:"long", year:"numeric" })}</h3>
      <div class="calg mb-1">${dows.map(x => `<span class="text-[11px] font-bold text-[#6d6d6d] text-center">${x}</span>`).join("")}</div>
      <div class="calg">${cells}</div>
    </div>`;
  }).join("");

  $("#view").innerHTML = `
    <h2 class="font-hed text-[30px] mb-1 mt-2">Choose a date</h2>
    <p class="text-[#9a9ab5] text-[14px] mb-4 font-medium">Tap a day to see everything on in SO. Numbers show listed events.</p>
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 min-[1800px]:grid-cols-4 gap-x-8">${monthsHtml}</div>`;
}

/* reminders: fire while the app is open; real push needs a backend */
function enableNotifs(){
  try {
    if (!("Notification" in window)){ toast("This browser doesn't support notifications", "", "bell-off"); return; }
    Notification.requestPermission().then((p) => {
      state.notifyOn = p === "granted";
      save(); render();
      if (state.notifyOn){ toast("Reminders on — day-before and show-day nudges", "mint", "bell"); checkReminders(); }
      else toast("Notifications blocked in browser settings", "", "bell-off");
    });
  } catch(e){}
}
function checkReminders(){
  try {
    if (!state.notifyOn || !("Notification" in window) || Notification.permission !== "granted") return;
    const tmrw = localISO(new Date(Date.now() + 864e5));
    upcoming().filter(e => state.rsvps[e.id] || state.saved[e.id]).forEach(ev => {
      const when = ev.date === TODAY ? "today" : ev.date === tmrw ? "tomorrow" : null;
      if (!when) return;
      const key = ev.id + "|" + when;
      if (state.notified[key]) return;
      state.notified[key] = 1;
      new Notification(`${ev.artist} is ${when}`, {
        body: `${ev.time && ev.time !== "TBC" ? ev.time + " · " : ""}${evVenueName(ev)} (${evPostcode(ev)})`,
        tag: key,
      });
    });
    save();
  } catch(e){}
}
function icsFor(id){
  const ev = getEvent(id); if (!ev) return;
  const d = ev.date.replace(/-/g, "");
  const t = ev.time && /^\d\d:\d\d$/.test(ev.time) ? ev.time.replace(":", "") + "00" : "190000";
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Soton Live//EN", "BEGIN:VEVENT",
    `UID:${ev.id}@sotonlive`, `DTSTART:${d}T${t}`, `SUMMARY:${ev.artist.replace(/[,;\\]/g, " ")}`,
    `LOCATION:${(evVenueName(ev) + " " + evPostcode(ev)).replace(/[,;\\]/g, " ")}`,
    "BEGIN:VALARM", "TRIGGER:-PT3H", "ACTION:DISPLAY", `DESCRIPTION:${ev.artist.replace(/[,;\\]/g, " ")} tonight`, "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  try {
    const a = document.createElement("a");
    a.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
    a.download = ev.artist.slice(0, 30).replace(/[^a-z0-9]+/gi, "-") + ".ics";
    document.body.appendChild(a); a.click(); a.remove();
    toast("Calendar file downloaded — reminder set 3h before", "mint", "calendar-plus");
  } catch(e){}
}
function exportProfile(){
  try {

      rsvps: state.rsvps, saved: state.saved, follows: state.follows, userEvents: state.userEvents };
    const a = document.createElement("a");
    a.href = "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(blob, null, 1));
    a.download = "sotonlive-profile.json";
    document.body.appendChild(a); a.click(); a.remove();
    toast("Profile exported — import it on any device", "mint", "download");
  } catch(e){}
}
function importProfile(file){
  try {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || d.v !== 1) { toast("Not a Soton Live profile file", "", "file-x"); return; }
        state.handle = d.handle || state.handle;
        state.homeDistrict = d.homeDistrict || state.homeDistrict;
        Object.assign(state.rsvps, d.rsvps || {});
        Object.assign(state.saved, d.saved || {});
        Object.assign(state.follows.venues, (d.follows || {}).venues || {});
        Object.assign(state.follows.artists, (d.follows || {}).artists || {});
        (d.userEvents || []).forEach(e => { if (!state.userEvents.some(x => x.id === e.id)) state.userEvents.push(e); });
        save(); render();
        toast("Profile imported ✓", "mint", "user-round-check");
      } catch(e){ toast("Couldn't read that file", "", "file-x"); }
    };
    r.readAsText(file);
  } catch(e){}
}

/* ---------- render root ---------- */
function render(){
  $$(".navbtn").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
  $$(".hnav").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
  const tonight = upcoming().filter(e => e.date === TODAY).length;
  const offline = !LIVE.ok;
  const stale = LIVE.ok && feedAgeHours() > 24;
  const label = offline ? "LISTINGS OFFLINE" : "LIVE IN SO";
  $("#liveLabel").textContent = !offline && tonight ? `${label} · ${tonight} TONIGHT` : label;
  $("#liveLabel").classList.toggle("text-mint", !(offline || stale));
  $("#liveLabel").classList.toggle("text-amberx", offline || stale);
  const dot = $("#liveDot"); if (dot) dot.classList.toggle("demo", offline || stale);
  $("#liveLabel").title = LIVE.generated ? "Listings updated " + timeAgo(new Date(LIVE.generated).getTime()) : "Listings unavailable";
  if (state.search){ const w = $("#searchWrap"); if (w) w.classList.remove("hidden"); }
  const bub = $("#walletBub");
  const wn = new Set([...Object.keys(state.rsvps).filter(k => state.rsvps[k]), ...Object.keys(state.saved).filter(k => state.saved[k])]).size;
  bub.classList.toggle("hidden", !wn); bub.textContent = wn;
  renderFilterBar();
  renderSideFilters();
  if (state.tab === "gigs") renderGigs();
  else if (state.tab === "calendar") renderCalendar();
  else if (state.tab === "venues") renderVenues();
  else if (state.tab === "community") renderCommunity();
  else renderSaved();
  icons();
  try {
    const tb = document.querySelector(".sticky.top-0");
    if (tb && tb.offsetHeight) document.documentElement.style.setProperty("--stickyh", tb.offsetHeight + "px");
  } catch(e){}
}

function fieldErr(id, errId, on, msg){
  const f = $("#" + id), e = $("#" + errId);
  if (f) f.classList.toggle("err", on);
  if (e){ e.classList.toggle("show", on); if (msg && on){ const m = e.querySelector("span"); if (m) m.textContent = msg; } }
  return !on;
}
function submitGig(){
  const title = $("#sg-title").value.trim();
  const date  = $("#sg-date").value;
  const time  = $("#sg-time").value || "19:30";
  const venue = $("#sg-venue").value.trim();
  const pcRaw = $("#sg-pc").value.trim().toUpperCase().replace(/\s+/g, " ");
  const price = Math.max(0, parseFloat($("#sg-price").value) || 0);
  const genre = $("#sg-genre").value;
  const img   = $("#sg-img").value.trim();

  let ok = true;
  ok = fieldErr("sg-title", "e-title", !title) && ok;
  ok = fieldErr("sg-venue", "e-venue", !venue) && ok;

  let pcOk = true, pcMsg = "";
  if (!/^SO/.test(pcRaw)){ pcOk = false; pcMsg = "SO postcodes only — this guide covers Greater Southampton."; }
  else if (!/^SO\d{1,2}(\s?\d[A-Z]{2})?$/.test(pcRaw)){ pcOk = false; pcMsg = "That doesn't look like a full SO postcode (try SO14 1NZ)."; }
  else { const d = district(pcRaw); if (![14,15,16,17,18,19,30,40,45,50,52,53].includes(d)){ pcOk = false; pcMsg = "That's outside our patch — Greater Southampton only (SO14–19, 30, 40, 45, 50, 52, 53)."; } }
  ok = fieldErr("sg-pc", "e-pc", !pcOk, pcMsg) && ok;

  if (!ok) return;

  const known = RUNTIME_VENUES.find(v => v.name.toLowerCase() === venue.toLowerCase());
  const ev = {
    id: "u" + Date.now(),
    artist: title, lineup: [],
    venueId: known ? known.id : null,
    venueName: venue,
    postcode: known ? known.postcode : pcRaw,
    date, time, price, genre,
    g: PALETTES[(state.userEvents.length + 3) % PALETTES.length],
    img: img || null,
    hype: 0, isNew: true, age: "Check with venue",
    access: known ? known.access : ["stepfree"]
  };
  if (sb && signedIn()){
    ev.type = "gig";
    ev.ticketUrl = null;
    cloudSubmit(ev).then(() => {
      closeModal("modalSubmit");
      loadCommunityEvents().then(render);
      toast("Submitted — a human checks it, then it's live for everyone ✅", "mint", "shield-check");
    }).catch(() => toast("Couldn't submit just now — try again", "", "cloud-off"));
    return;
  }
  state.userEvents.unshift(ev);
  save();
  closeModal("modalSubmit");
  clearFilters();
  setTab("gigs");
  toast("Your gig is live at the top of the feed 🎸", "violet", "megaphone");
}

    state.handle = h; save();
    window.AUTH_LOCK = false;
    closeModal("modalAuth");
    toast(`Welcome to the scene, ${h} 🤘`, "mint", "user-round-check");
    await pullCloudState();
    render();
  } catch (e) {
    fail(/duplicate|unique/i.test(String(e.message)) ? "That name's taken — try another." : /permanent/i.test(String(e.message)) ? "Your display name is already set and can't be changed." : "Couldn't save — try again.");
  }
}

/* ---- session lifecycle ---- */
async function onSession(session){
  me = session ? session.user : null;
  if (!me){ myProfile = null; render(); return; }
  try {
    const { data } = await sb.from("profiles").select("handle").eq("id", me.id).maybeSingle();
    myProfile = data || null;
    if (myProfile){
      try {
        const pv = await sb.from("profile_private").select("postcode").eq("user_id", me.id).maybeSingle();
        if (pv.data) myProfile.postcode = pv.data.postcode;
      } catch (e) {}
    }
  } catch (e) { myProfile = null; }
  let skipped = false;
  try { skipped = sessionStorage.getItem("sl-skip-setup") === "1"; } catch(e){}
  if (!myProfile){ if (!skipped) openAuth("Last step — choose your name.", "handle"); }
  else {
    state.handle = myProfile.handle; if (myProfile.district) state.homeDistrict = myProfile.district; save();
    await pullCloudState();
  }
  render();
}

/* ---- sync: follows + saves (union merge, local wins nothing, loses nothing) ---- */
async function pullCloudState(){
  if (!signedIn()) return;
  try {
    const [fl, sv] = await Promise.all([
      sb.from("follows").select("kind,target"),
      sb.from("saves").select("event_id,state"),
    ]);
    const pushes = [];
    (fl.data || []).forEach(r => {
      if (r.kind === "venue") state.follows.venues[r.target] = 1;
      else state.follows.artists[r.target] = state.follows.artists[r.target] || r.target;
    });
    (sv.data || []).forEach(r => {
      if (r.state === "going") state.rsvps[r.event_id] = true;
      else state.saved[r.event_id] = true;
    });
    // push local-only up (first-login migration)
    Object.keys(state.follows.venues).forEach(t => pushes.push({ kind: "venue", target: t }));
    Object.keys(state.follows.artists).forEach(t => pushes.push({ kind: "artist", target: t }));
    if (pushes.length) await sb.from("follows").upsert(pushes.map(p => ({ user_id: me.id, ...p })), { ignoreDuplicates: true });
    const savePushes = [
      ...Object.keys(state.rsvps).map(id => ({ user_id: me.id, event_id: id, state: "going" })),
      ...Object.keys(state.saved).filter(id => !state.rsvps[id]).map(id => ({ user_id: me.id, event_id: id, state: "saved" })),
    ];
    if (savePushes.length) await sb.from("saves").upsert(savePushes);
    save();
  } catch (e) { /* offline is fine — local cache rules */ }
}
function cloudFollow(kind, target, on){
  if (!signedIn()) return;
  try {
    if (on) sb.from("follows").upsert({ user_id: me.id, kind, target }).then(() => {});
    else sb.from("follows").delete().match({ user_id: me.id, kind, target }).then(() => {});
  } catch (e) {}
}
function cloudSave(eventId){
  if (!signedIn()) return;
  try {
    const going = !!state.rsvps[eventId], saved = !!state.saved[eventId];
    if (going) sb.from("saves").upsert({ user_id: me.id, event_id: eventId, state: "going" }).then(() => {});
    else if (saved) sb.from("saves").upsert({ user_id: me.id, event_id: eventId, state: "saved" }).then(() => {});
    else sb.from("saves").delete().match({ user_id: me.id, event_id: eventId }).then(() => {});
  } catch (e) {}
}

/* ---- shared scene board ---- */
async function loadBoard(){
  if (!sb) return;
  try {
    const [posts, votes, comments] = await Promise.all([
      sb.from("posts").select("id,user_id,cat,title,body,created_at,profiles(handle)").order("created_at", { ascending: false }).limit(60),
      sb.from("post_votes").select("post_id,user_id"),
      sb.from("comments").select("id,post_id,body,created_at,profiles(handle)").order("created_at", { ascending: true }).limit(400),
    ]);
    if (posts.error) throw posts.error;
    const vByPost = {}, myVotes = {};
    (votes.data || []).forEach(v => { vByPost[v.post_id] = (vByPost[v.post_id] || 0) + 1; if (me && v.user_id === me.id) myVotes[v.post_id] = true; });
    const cByPost = {};
    (comments.data || []).forEach(c => (cByPost[c.post_id] = cByPost[c.post_id] || []).push({ id: c.id, who: (c.profiles || {}).handle || "someone", body: c.body, at: c.created_at }));
    boardCache = (posts.data || []).map(p => ({
      id: p.id, cat: p.cat, title: p.title, body: p.body, at: p.created_at,
      who: (p.profiles || {}).handle || "someone", mine: !!(me && p.user_id === me.id),
      votes: vByPost[p.id] || 0, voted: !!myVotes[p.id], comments: cByPost[p.id] || [],
    }));
  } catch (e) { boardCache = boardCache || null; }
}
async function cloudPost(cat, title, bodyTxt){
  const { error } = await sb.from("posts").insert({ user_id: me.id, cat, title, body: bodyTxt });
  if (error) throw error;
  await loadBoard();
}
async function cloudComment(postId, bodyTxt){
  const { error } = await sb.from("comments").insert({ user_id: me.id, post_id: postId, body: bodyTxt });
  if (error) throw error;
  await loadBoard();
}
async function cloudVote(postId, on){
  if (on) await sb.from("post_votes").upsert({ user_id: me.id, post_id: postId });
  else await sb.from("post_votes").delete().match({ user_id: me.id, post_id: postId });
  await loadBoard();
}

/* ---- community gig submissions (pre-moderated) ---- */
async function cloudSubmit(ev){
  const row = {
    user_id: me.id, artist: ev.artist, venue_name: ev.venueName, postcode: ev.postcode,
    date: ev.date, time: ev.time && ev.time !== "TBC" ? ev.time : null,
    price: ev.price == null ? null : ev.price, descr: ev.desc || null,
    ticket_url: ev.ticketUrl || null, genre: ev.genre || null, type: ev.type || null,
  };
  const { error } = await sb.from("submissions").insert(row);
  if (error) throw error;
}
async function loadCommunityEvents(){
  if (!sb) return;
  try {
    const { data, error } = await sb.from("submissions").select("*").gte("date", TODAY).order("date");
    if (error) throw error;
    communityEvents = (data || []).map(r => feedEvent({
      id: "cs-" + r.id, artist: r.artist, venueName: r.venue_name, postcode: r.postcode,
      date: r.date, time: r.time, price: r.price == null ? null : +r.price, priceMax: r.price == null ? null : +r.price,
      desc: r.descr, ticketUrl: r.ticket_url, genre: r.genre, type: r.type || "gig",
      source: "community", img: null, going: 0,
    }));
    communityEvents.forEach(e => { e.isNew = true; e.pending = false; });
    // rows I can see that aren't approved are my own pending ones
    (data || []).forEach((r, i) => { if (r.status !== "approved") communityEvents[i].pending = true; });
  } catch (e) { /* keep last */ }
}

/* ---- claims ---- */
async function cloudClaim(kind, target, evidence, message){
  const { error } = await sb.from("claims").insert({ user_id: me.id, kind, target, evidence_url: evidence || null, message: message || null });
  if (error) throw error;
}

async function removePostcode(){

async function signOut(){

async function deleteAccount(){

function openClaim(kind){
  if (!requireAuth(`Sign in to claim your ${kind} profile — we verify every claim by hand.`)) return;
  const body = $("#modalAuthBody"); if (!body) return;
  body.innerHTML = `
    <div class="p-5 pt-6 flex flex-col gap-3">
      <h2 class="font-hed text-[24px]">Claim your ${esc(kind)} profile</h2>
      <p class="text-[13.5px] text-[#9a9ab5]">Tell us who you are and give us one link that proves it (your official site or social). A human verifies and hands you the keys — free while we launch.</p>

      <p id="clm-err" class="text-[13px] text-rosex font-semibold hidden"></p>

}
async function sendClaim(kind){
  const target = ($("#clm-target") && $("#clm-target").value || "").trim();
  const ev = ($("#clm-evidence") && $("#clm-evidence").value || "").trim();
  const msg = ($("#clm-msg") && $("#clm-msg").value || "").trim();
  const err = $("#clm-err");
  if (target.length < 2){ if (err){ err.textContent = "Give us the name you're claiming."; err.classList.remove("hidden"); } return; }
  try {
    await cloudClaim(kind, target, ev, msg);
    closeModal("modalAuth");
    toast("Claim received — we'll email you once it's verified ✅", "mint", "badge-check");
  } catch (e) { if (err){ err.textContent = "Couldn't send just now — try again."; err.classList.remove("hidden"); } }
}

function bootCloud(){
  if (!sb) return;
  try {
    sb.auth.getSession().then(({ data }) => onSession(data ? data.session : null));
    sb.auth.onAuthStateChange((_evt, session) => { onSession(session); });
    loadCommunityEvents().then(() => { if (communityEvents.length) render(); });
  } catch (e) {}
}

/* ==================== end CLOUD ==================== */

/* ---------- share + deep links ---------- */
let suppressHash = false;
function setHash(h){
  try {
    suppressHash = true;
    if (location.hash !== h) location.hash = h;
    setTimeout(() => { suppressHash = false; }, 50);
  } catch(e){ suppressHash = false; }
}
function eventUrl(id){
  try {
    if (location.origin && location.origin !== "null") return location.origin + location.pathname + "#/e/" + id;
  } catch(e){}
  return "";
}
async function shareEvent(id){
  const ev = getEvent(id); if (!ev) return;
  const url = eventUrl(id);
  const text = `${ev.artist} — ${dateLabel(ev.date)} ${ev.time} at ${evVenueName(ev)} (${evPostcode(ev)})`;
  try {
    if (navigator.share){ await navigator.share({ title: ev.artist, text, url: url || undefined }); return; }
  } catch(e){ return; } // user cancelled the sheet
  try {
    await navigator.clipboard.writeText(url ? `${text}\n${url}` : text);
    toast("Copied — send it to your gig people 📋", "violet", "copy");
  } catch(e){
    toast("Sharing isn't available here", "", "share-2");
  }
}
function applyHash(){
  try {
    const h = String(location.hash || "").replace(/^#\/?/, "");
    if (!h) return;
    const [key, val] = h.split("/");
    if (key === "e" && val){ if (getEvent(val)) { setTab("gigs"); openEvent(val); } }
    else if (key === "day" && val){ state.filters.date = "custom"; state.filters.customDate = val; setTab("gigs"); }
    else if (key === "weekend"){ state.filters.date = "weekend"; setTab("gigs"); }
    else if (key === "tonight"){ state.filters.date = "today"; setTab("gigs"); }
    else if (key === "venue" && val){ state.filters.venue = val; setTab("gigs"); }
    else if (key === "type" && TYPES[val]){ state.filters.type = val; setTab("gigs"); }
    else if (key === "tab" && ["gigs","calendar","venues","community","saved"].includes(val)){ setTab(val); }
  } catch(e){}
}

/* ---------- modal + toast plumbing ---------- */
function openModal(id, soft){
  $("#" + id).classList.add("open");
  if (!soft) document.body.style.overflow = "hidden";
}
function closeModal(id){
  const el = $("#" + id); if (!el) return;
  el.classList.remove("open");
  if (id === "modalEvent"){ modalEventId = null; setHash("#/"); }
  document.body.style.overflow = "";
}
function toast(msg, tone = "", icon = "check"){
  const t = document.createElement("div");
  t.className = "toast " + tone;
  t.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 shrink-0"></i><span>${esc(msg)}</span>`;
  $("#toasts").appendChild(t);
  icons();
  setTimeout(() => { t.style.transition = "opacity .3s, transform .3s"; t.style.opacity = "0"; t.style.transform = "translateY(8px)"; }, 2600);
  setTimeout(() => t.remove(), 2950);
}

/* ---------- live listings feed ---------- */
const FEED_URL = "events.json";
const FEED_REFRESH_MS = 15 * 60 * 1000;
let LIVE = { ok:false, tried:false, events:[], generated:null, sources:[] };

const hashPal = (s, seed) => PALETTES[Math.abs([...String(s)].reduce((a, c) => (a * 33 + c.charCodeAt(0)) | 0, seed)) % PALETTES.length];

function feedEvent(e){
  return {
    id: String(e.id),
    artist: String(e.artist || "").trim(),
    lineup: [],
    venueId: e.venueId || null,
    venueName: e.venueName || "TBA",
    postcode: String(e.postcode || "").toUpperCase(),
    date: e.date, time: e.time || "TBC",
    price: e.price == null ? null : +e.price,
    priceMax: e.priceMax == null ? null : +e.priceMax,
    priceText: e.priceText || null,
    genre: GENRES[e.genre] ? e.genre : "indie",
    type: TYPES[e.type] ? e.type : "gig",
    tags: Array.isArray(e.tags) ? e.tags.slice(0, 4) : [],
    hot: !!e.hot,
    g: hashPal(e.id, 7),
    img: e.img || null,
    ticketUrl: e.ticketUrl || null,
    infoUrl: e.infoUrl || null,
    hype: Math.max(0, +e.going || 0),
    age: e.minage ? String(e.minage).replace(/\+?$/, "+") : null,
    desc: e.desc || null,
    source: e.source || null,
    access: (venueOf({ venueId: e.venueId }) || {}).access || []
  };
}

function mergeVenues(vs){
  for (const v of vs || []){
    if (!v || !v.id || RUNTIME_VENUES.some(x => x.id === v.id)) continue;
    RUNTIME_VENUES.push({
      id: v.id, name: v.name || v.id, address: v.address || "Southampton",
      postcode: String(v.postcode || "").toUpperCase(), capacity: null,
      vibe: "Live music & club nights", g: hashPal(v.id, 5), icon: "music", access: []
    });
  }
}

function hydrateFeed(d, fromNetwork){
  if (!d || !Array.isArray(d.events)) return false;
  const t = localISO(new Date());
  const evs = d.events.map(feedEvent).filter(e => e.artist && e.date && e.date >= t);
  if (!evs.length) return false;
  mergeVenues(d.venues);
  LIVE = {
    ok: true, tried: LIVE.tried || !!fromNetwork, fresh: !!fromNetwork,
    events: evs,
    generated: d.generated || null,
    sources: (d.sources || []).filter(s => s.ok)
  };
  return true;
}

// Real listings bundled into this file at build time, so the guide works
// even before (or without) a network fetch — never placeholder content.
function bootFeedFromSnapshot(){
  try {
    const el = document.getElementById("feedSnapshot");
    if (el) hydrateFeed(JSON.parse(el.textContent), false);
  } catch (e) {}
}

// Age of the listings data in hours (Infinity if unknown)
function feedAgeHours(){
  if (!LIVE.generated) return Infinity;
  return (Date.now() - new Date(LIVE.generated).getTime()) / 36e5;
}

async function loadFeed(){
  try {
    const r = await fetch(FEED_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    // only replace current data if the fetched feed is usable and not older
    if (!LIVE.ok || !d.generated || !LIVE.generated || d.generated >= LIVE.generated) hydrateFeed(d, true);
    else LIVE.tried = true;
  } catch (e){
    LIVE.tried = true; // keep whatever real data we already have
  }
  render();
}

function toggleSearch(){
  const w = $("#searchWrap");
  const open = w.classList.toggle("hidden");
  if (!open){ const inp = $("#searchInput"); if (inp) inp.focus(); }
  else if (state.search){ clearSearch(); }
}

/* ---------- boot ---------- */
loadState();
$("#searchInput").addEventListener("input", e => {
  state.search = e.target.value.trim();
  $("#searchClear").classList.toggle("hidden", !state.search);
  if (state.search && state.tab !== "gigs") state.tab = "gigs";
  render();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ closeModal("modalEvent"); closeModal("modalSubmit"); }
});
bootFeedFromSnapshot();
try { renderAd(); } catch(e){}
try { bootCloud(); } catch(e){}
try { checkReminders(); setInterval(checkReminders, 30 * 60 * 1000); } catch(e){}
try { window.addEventListener("hashchange", () => { if (!suppressHash) applyHash(); }); } catch(e){}
applyHash();
render();
loadFeed();
setInterval(loadFeed, FEED_REFRESH_MS);
</script>
